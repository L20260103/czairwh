<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coolzone 库存试用</title>
</head>
<body>

<section class="open-help">
  <p><strong>Coolzone 库存试用 · 离线单文件</strong></p>
  <p>在电脑上：用 Chrome、Edge 或 Safari 打开这个文件（双击，或在浏览器里选择“打开文件”）。不要用邮件正文里的预览。</p>
  <p>在 iPad 上：文件 App 的快速查看不会运行这个程序，所以会像打不开。请改用 Safari 打开本地 HTML。如果系统只提供快速查看、没有在 Safari 中打开的选项，这个文件就不能在那台 iPad 上运行。</p>
  <p>未连接 Tradify / monday。初始内容是示例数据。若浏览器不允许保存，页面里会有醒目的橙色提示；这时仍可记账和导出 CSV，但关掉页面后新记录会消失。</p>
  <button type="button" onclick="this.parentElement.remove()">知道了，进入试用</button>
</section>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
